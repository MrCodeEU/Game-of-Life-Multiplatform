name: Build and Deploy

on:
  push:
    branches: [ Main ]
  workflow_dispatch:
  schedule:
    # weekly rebuild so base-image security fixes reach the deployed image
    - cron: '17 3 * * 1'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mrcodeeu/game-of-life-multiplatform:latest
            ghcr.io/mrcodeeu/game-of-life-multiplatform:${{ github.sha }}
          # scheduled/manual runs skip the layer cache, otherwise apk/apt layers stay frozen
          no-cache: ${{ github.event_name != 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger homelab deployment
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/MrCodeEU/homelab-automation/dispatches \
            -d '{"event_type":"service-update","client_payload":{"service":"gameoflife","environment":"production"}}'
